# Include from nginx's http context (e.g. /etc/nginx/conf.d/shiyi.conf).
# Replace study.example.com and certificate paths before enabling.

# Cloudflare real client IP restoration (sync IPs daily from https://www.cloudflare.com/ips-v4 and ips-v6;
# also lock origin ports 80/443 to Cloudflare IP ranges or enable Authenticated Origin Pulls):
# include /etc/nginx/conf.d/cloudflare-ips.conf;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

limit_req_zone $binary_remote_addr zone=auth_tight:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_general:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=ai_stream:10m rate=15r/m;
limit_req_zone $binary_remote_addr zone=heavy_io:10m rate=2r/m;
limit_req_zone $binary_remote_addr zone=health_check:5m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=auth_conn:10m;
limit_conn_zone $binary_remote_addr zone=sse_conn:10m;
limit_conn_zone $binary_remote_addr zone=heavy_conn:10m;
limit_req_status 429;
limit_conn_status 429;

proxy_cache_path /var/cache/nginx/shiyi_static levels=1:2 keys_zone=shiyi_static:10m max_size=512m inactive=30d use_temp_path=off;

upstream shiyi_app {
    server 127.0.0.1:3000;
    keepalive 32;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name study.example.com;
    return 301 https://study.example.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name study.example.com;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/study.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/study.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml font/woff2;

    client_max_body_size 1m;
    client_body_timeout 15s;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";

    location ^~ /_next/static/ {
        proxy_pass http://shiyi_app;
        proxy_buffering on;
        proxy_cache shiyi_static;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    location ~ ^/api/auth/(sign-in|sign-up|email-otp|request-password-reset) {
        limit_req zone=auth_tight burst=5 nodelay;
        limit_conn auth_conn 6;
        proxy_pass http://shiyi_app;
        proxy_buffering on;
        proxy_cache off;
        proxy_read_timeout 30s;
    }

    location = /api/health {
        limit_req zone=health_check burst=10 nodelay;
        proxy_pass http://shiyi_app;
        proxy_buffering on;
        proxy_cache off;
        proxy_read_timeout 10s;
    }

    location = /api/chat {
        limit_req zone=ai_stream burst=5 nodelay;
        limit_conn sse_conn 3;
        proxy_pass http://shiyi_app;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 180s;
    }

    location = /api/backup/restore {
        limit_req zone=heavy_io burst=1 nodelay;
        limit_conn heavy_conn 1;
        client_max_body_size 21m;
        client_body_timeout 60s;
        proxy_pass http://shiyi_app;
        proxy_buffering on;
        proxy_cache off;
        proxy_read_timeout 180s;
    }

    location = /api/export {
        limit_req zone=heavy_io burst=2 nodelay;
        limit_conn heavy_conn 1;
        proxy_pass http://shiyi_app;
        proxy_buffering on;
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    location ^~ /api/ {
        limit_req zone=api_general burst=30 nodelay;
        proxy_pass http://shiyi_app;
        proxy_buffering on;
        proxy_buffers 16 16k;
        proxy_buffer_size 16k;
        proxy_cache off;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://shiyi_app;
        proxy_buffering on;
        proxy_buffers 16 16k;
        proxy_buffer_size 16k;
        proxy_cache off;
        proxy_read_timeout 60s;
    }
}
