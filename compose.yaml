services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: shiyi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: shiyi
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shiyi -d shiyi"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  app:
    image: ${SHIYI_IMAGE:-ghcr.io/cforiky630/interview-mem:main}
    init: true
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: shiyi
      PGDATABASE: shiyi
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set public HTTPS origin}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}
      KEY_ENCRYPTION_SECRET: ${KEY_ENCRYPTION_SECRET:?Set KEY_ENCRYPTION_SECRET}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
volumes:
  postgres-data:
